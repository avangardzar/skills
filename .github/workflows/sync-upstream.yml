name: Sync upstream mirror

# Обновляет ветку-зеркало из первоисточника. Единственный процесс, которому
# принадлежит запись в неё: человек в зеркало не пишет (ADR-0001).
#
# Расписание обязано быть литералом: ключи внутри `on:` не принимают выражения
# и контексты, `${{ vars.* }}` здесь не раскроется. Параметры, которые читают
# шаги, вынесены в `env:` ниже.
#
# Сторонних действий здесь нет намеренно. Всё, что нужно, — git, который на
# раннере уже есть; отсутствие зависимостей избавляет от пиннинга по SHA и от
# доверия чужому коду, имеющему доступ к токену с правом записи.

on:
  schedule:
    - cron: '0 3 * * *' # 06:00 MSK
  workflow_dispatch:

concurrency: sync-upstream

# По умолчанию токен не может ничего; право записи выдаётся одному заданию.
permissions: {}

env:
  UPSTREAM_URL: https://github.com/mattpocock/skills.git
  UPSTREAM_BRANCH: main
  MIRROR_BRANCH: upstream

jobs:
  sync:
    name: Fast-forward mirror
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Fast-forward mirror onto upstream
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Только ветка-зеркало и без тегов: теги первоисточника именуют
          # версии чужого плагина и в этом репозитории не нужны.
          git clone --quiet --no-tags --single-branch --branch "$MIRROR_BRANCH" \
            "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" mirror
          cd mirror

          git remote add source "$UPSTREAM_URL"
          git fetch --no-tags source "$UPSTREAM_BRANCH"

          before=$(git rev-parse HEAD)
          after=$(git rev-parse FETCH_HEAD)
          if [ "$before" = "$after" ]; then
            echo "Зеркало уже на $after — делать нечего."
            exit 0
          fi

          # --ff-only: если зеркало разошлось с первоисточником, значит в него
          # кто-то писал руками. Это ошибка, а не повод делать merge-коммит.
          git merge --ff-only FETCH_HEAD
          git push origin "HEAD:$MIRROR_BRANCH"
          echo "Зеркало: $before -> $after"
